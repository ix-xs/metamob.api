name: Data watch

# Weekly, compares the pinned reference data with the API. A failure means:
# run `npm run data:update` and release a patch version.
# Needs the METAMOB_API_KEY repository secret, and does nothing without it.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      METAMOB_API_KEY: ${{ secrets.METAMOB_API_KEY }}
    steps:
      - name: Is there a key?
        id: key
        run: echo "present=${{ env.METAMOB_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.present == 'true'
      - run: node scripts/update-data.mjs --check
        if: steps.key.outputs.present == 'true'
